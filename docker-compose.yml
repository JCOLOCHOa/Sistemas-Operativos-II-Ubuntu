version: "3.8"

services:
  mongo:
    image: mongo:6-jammy
    container_name: so2-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - so2-network

  backend:
    build: ./backend
    container_name: so2-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/eventlogs
    depends_on:
      - mongo
    networks:
      - so2-network

  frontend:
    image: nginx:alpine
    container_name: so2-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - so2-network

volumes:
  mongo_data:

networks:
  so2-network:
    driver: bridge
