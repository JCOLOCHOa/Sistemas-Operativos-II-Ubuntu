
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA DE MONITOREO TÁCTICO | Log de Eventos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="particles"></div>
<div class="crt-overlay"></div>
<div class="scanline"></div>
<div class="vignette"></div>
<div class="container">
  <header>
  <h1>
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1"/>
      <line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="1.5"/>
      <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="1.5"/>
      <line x1="2" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.5"/>
      <line x1="18" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 12 L18 6" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
    </svg>
    <span class="glitch" data-text="SISTEMA DE MONITOREO TACTICO">
      SISTEMA DE MONITOREO TACTICO
    </span>
  </h1>
  <div class="status" id="status"><span>Conectado</span></div>
</header>

  <section class="form-section">
    <h2>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <line x1="12" y1="2" x2="12" y2="5" stroke="currentColor" stroke-width="2"/>
        <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2"/>
        <line x1="2" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="2"/>
        <line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/>
      </svg>
      Registrar Nuevo Evento
    </h2>
    <form id="eventForm">
      <input type="text" id="tipo" placeholder="TIPO DE ACCION" required>
      <input type="text" id="mensaje" placeholder="MENSAJE TACTICO" required>
      <input type="text" id="datos" placeholder='DATOS JSON {"clave":"valor"}'>
      <button type="submit">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Transmitir
      </button>
    </form>
  </section>

  <section class="events-section">
    <h2>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="3" width="16" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <line x1="8" y1="8" x2="16" y2="8" stroke="currentColor" stroke-width="1.5"/>
        <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.5"/>
        <line x1="8" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      Registro de Eventos
    </h2>
    <button onclick="cargarEventos()" class="refresh-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M23 4v6h-6M1 20v-6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Actualizar Intel
    </button>
    <div id="eventsList" class="events-list">
      <p class="empty">Esperando las transmisiones...</p>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
